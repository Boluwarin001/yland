<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign in · YourLandlordship</title>
<script src="landlord/tailwind.js"></script>
</head>
<body class="min-h-screen bg-[#FAF4DF] text-slate-800 antialiased">

<div class="min-h-screen flex items-center justify-center px-6 py-12">
  <div class="w-full max-w-md">

    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-3">
      <svg width="30px" viewBox="0 0 827 1080" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" xmlns:serif="http://www.serif.com/" fill="#E3572B">
        <path d="M826.09,1080L0,1080L0,301.281L826.09,0L826.09,1080ZM663.085,291.5L463.149,363.778L463.149,846.063L663.085,846.063L663.085,291.5ZM362.943,392.324L163.005,466.024L163.005,846.063L362.943,846.063L362.943,392.324Z"></path>
      </svg>
        <span class="text-xl font-semibold text-[#1D3639]">YourLandlordship</span>
      </a>
      <p class="mt-4 text-md text-slate-500">Sign in to your account</p>
    </div>

    <div class="bg-white rounded-2xl border border-[#e9e2cc] shadow-sm p-7">
      <div class="space-y-5">

        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-2">Email address</label>
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com" class="w-full h-12 px-4 rounded-xl border border-slate-200 bg-white text-md outline-none focus:border-[#1D3639] focus:ring-2 focus:ring-[#1D3639]/10">
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label for="password" class="text-sm font-medium text-slate-700">Password</label>
            <a href="#" class="text-sm text-[#E3572B] hover:underline">Forgot password?</a>
          </div>
          <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" class="w-full h-12 px-4 rounded-xl border border-slate-200 bg-white text-md outline-none focus:border-[#1D3639] focus:ring-2 focus:ring-[#1D3639]/10">
        </div>

        <label class="flex items-center gap-3 cursor-pointer">
          <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-[#1D3639] focus:ring-[#1D3639]">
          <span class="text-sm text-slate-500">Remember me</span>
        </label>

        <a href="landlord/">
        <button class="w-full h-12 rounded-xl bg-[#1D3639] text-white text-md font-medium hover:opacity-90 transition">
          Sign in
        </button>
        </a>    

    </div>
    </div>

    <p class="text-center mt-6 text-sm text-slate-500">
      Don't have an account?
      <a href="#" class="text-[#1D3639] font-medium hover:underline">Contact us</a>
    </p>

    <div class="text-center mt-8">
      <a href="index.html" class="text-sm text-slate-400 hover:text-[#1D3639]">← Back to YourLandlordship</a>
    </div>

  </div>
</div>

</body>
</html>
