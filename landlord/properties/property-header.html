<!-- property-header.html -->
<h1 class="text-xl font-semibold mb-6 mt-8">34 Glemwood Street, Liverpool.</h1>

<!-- Mobile navigation -->
<div class="lg:hidden mb-6 relative">
  <label for="propertyTabSelect" class="block text-xs font-medium text-slate-500 mb-2">Property section</label>
  <div class="relative">
    <select id="propertyTabSelect" class="w-full appearance-none rounded-xl border border-slate-200 bg-white px-4 py-3 pr-10 text-md text-slate-700 focus:outline-none focus:ring-2 focus:ring-[#1D3639]/10 focus:border-[#1D3639]">
      <option value="property-index.html">Home</option>
      <option value="property-interests.html">Interests & Applications</option>
      <option value="property-details.html">Property Details</option>
      <option value="property-tenancy.html">Tenancy</option>
      <option value="property-documents.html">Documents</option>
      <option value="property-terms.html">Settings</option>
      <option value="property-move-in-out.html">Move In/Out</option>
      <option value="property-history.html">History</option>
    </select>
    <svg class="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="m6 9 6 6 6-6"/>
    </svg>
  </div>
</div>

<!-- Desktop navigation -->
<div class="hidden lg:block border-b border-slate-200 overflow-x-auto">
  <div class="flex min-w-max">
    <a href="property-index.html"><button data-tab="home" class="px-5 pb-3.5 text-sm text-slate-400 border-b-2 border-transparent cursor-pointer hover:text-slate-700">Home</button></a>

    <a href="property-interests.html"><button data-tab="interests" class="px-5 pb-3.5 text-sm text-slate-400 border-b-2 border-transparent cursor-pointer hover:text-slate-700">Interests & Applications</button></a>

    <a href="property-details.html"><button data-tab="info" class="px-5 pb-3.5 text-sm text-slate-400 border-b-2 border-transparent cursor-pointer hover:text-slate-700">Property Details</button></a>

    <a href="property-tenancy.html"><button data-tab="tenant" class="px-5 pb-3.5 text-sm text-slate-400 border-b-2 border-transparent cursor-pointer hover:text-slate-700">Tenancy</button></a>

    <a href="property-documents.html"><button data-tab="documents" class="px-5 pb-3.5 text-sm text-slate-400 border-b-2 border-transparent cursor-pointer hover:text-slate-700">Documents</button></a>

    <a href="property-terms.html"><button data-tab="terms" class="px-5 pb-3.5 text-sm text-slate-400 border-b-2 border-transparent cursor-pointer hover:text-slate-700">Settings</button></a>

    <a href="property-move-in-out.html"><button data-tab="move" class="px-5 pb-3.5 text-sm text-slate-400 border-b-2 border-transparent cursor-pointer hover:text-slate-700">Move In/Out</button></a>

    <a href="property-history.html"><button data-tab="history" class="px-5 pb-3.5 text-sm text-slate-400 border-b-2 border-transparent cursor-pointer hover:text-slate-700">History</button></a>
  </div>
</div>

<script>
document.getElementById("propertyTabSelect")?.addEventListener("change",function(){window.location.href=this.value});
</script>
