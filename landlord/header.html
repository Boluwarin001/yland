<!-- /landlord/header.html -->
<header class="h-14 border-b border-slate-200 bg-white flex items-center justify-between px-5 shrink-0">
  <div class="flex items-center gap-4">
    <button id="sidebarToggle" class="lg:hidden text-slate-700" aria-label="Open menu">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <div class="hidden sm:flex items-center gap-3 text-slate-700">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M4 5.5h6v6H4zM14 5.5h6v6h-6zM4 15.5h6v3H4zM14 15.5h6v3h-6z"/>
      </svg>
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M7 8h10M7 12h6m-9 7 3-3h7a4 4 0 0 0 4-4V7a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v8a4 4 0 0 0 2 3z"/>
      </svg>
      <span class="text-sm text-slate-400">Dashboard</span>
      <span class="text-slate-300">/</span>
      <span class="text-sm font-semibold text-slate-900">Properties</span>
    </div>
  </div>

  <div class="flex items-center gap-5">
    <div class="hidden md:flex w-36 lg:w-40 h-8 rounded-lg bg-slate-50 border border-slate-100 items-center px-3 gap-2 text-slate-400">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5" stroke-width="1.7"/>
        <path stroke-linecap="round" stroke-width="1.7" d="m16 16 4 4"/>
      </svg>
      <span class="text-xs">Search</span>
      <span class="ml-auto text-[10px]">⌘</span>
    </div>

    <button class="text-slate-700" aria-label="Toggle theme">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3.5" stroke-width="1.6"/>
        <path stroke-linecap="round" stroke-width="1.6" d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
      </svg>
    </button>

    <button class="text-slate-700" aria-label="Calendar">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <rect x="4" y="5" width="16" height="15" rx="2" stroke-width="1.6"/>
        <path stroke-width="1.6" d="M8 3v4M16 3v4M4 9h16"/>
        <path stroke-linecap="round" stroke-width="1.5" d="M8 13h.01M12 13h.01M16 13h.01M8 16h.01M12 16h.01"/>
      </svg>
    </button>

    <button id="notificationButton" class="relative text-slate-700" aria-label="Notifications">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
      </svg>
      <span class="absolute -top-0.5 -right-1 w-1.5 h-1.5 rounded-full bg-slate-900"></span>
    </button>

    <button class="text-slate-700" aria-label="Panel">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <rect x="5" y="4" width="14" height="16" rx="1.5" stroke-width="1.6"/>
        <path stroke-width="1.6" d="M9 8h6M9 12h6M9 16h3"/>
      </svg>
    </button>
  </div>
</header>
